name: Desktop release

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  RELEASE_TAG: v0.3.0

permissions:
  contents: write

concurrency:
  group: desktop-release-v0.3.0
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Match tag to every project version
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @jauto/web build
      - run: pnpm --filter @jauto/desktop build:frontend

  build:
    name: Build ${{ matrix.label }}
    needs: [validate, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, os: windows-latest }
          - { label: macos-universal, os: macos-latest }
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @jauto/core --filter @jauto/jff --filter @jauto/simulator --filter @jauto/file-io --filter @jauto/ui build

      - name: Configure optional Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $values = @($env:WINDOWS_CERTIFICATE, $env:WINDOWS_CERTIFICATE_PASSWORD)
          $configured = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configured -eq 0) {
            'WINDOWS_SIGNING_MODE=unsigned' | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Output 'Windows signing credentials are unavailable; building unsigned installers.'
          } elseif ($configured -ne $values.Count) {
            throw 'Windows signing is only partially configured. Set both WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD, or leave both unset.'
          } else {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'jauto-release.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } }
            $config | ConvertTo-Json -Depth 5 | Set-Content apps/desktop/src-tauri/tauri.release.conf.json
            'WINDOWS_SIGNING_MODE=signed' | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          values=("$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY" "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID")
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "APPLE_SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
            echo "Apple signing credentials are unavailable; building an ad-hoc signed installer."
          elif [[ "$configured" -ne "${#values[@]}" ]]; then
            echo "Apple signing is only partially configured. Set all Apple release secrets, or leave all of them unset." >&2
            exit 1
          else
            echo "APPLE_SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
          fi

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_MODE == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/jauto-release.p12"
          keychain_path="$RUNNER_TEMP/jauto-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"

      - name: Build Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          if ($env:WINDOWS_SIGNING_MODE -eq 'signed') {
            pnpm tauri build --config src-tauri/tauri.release.conf.json
          } else {
            pnpm tauri build
          }

      - name: Build universal macOS installer
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: pnpm tauri build --target universal-apple-darwin

      - name: Verify Windows installers and configured signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi
          if (-not $files) { throw 'No Windows installers were produced.' }
          if ($env:WINDOWS_SIGNING_MODE -eq 'signed') {
            foreach ($file in $files) {
              $signature = Get-AuthenticodeSignature $file.FullName
              if ($signature.Status -ne 'Valid') { throw "Invalid signature on $($file.Name): $($signature.Status)" }
            }
          }
      - name: Smoke-test installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -Filter *.msi | Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP 'jauto-installed'
          $process = Start-Process msiexec.exe -ArgumentList @('/a', $msi.FullName, '/qn', "TARGETDIR=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative install failed: $($process.ExitCode)" }
          $executable = Get-ChildItem $installRoot -Recurse -Filter jauto.exe | Select-Object -First 1
          if (-not $executable) { throw 'Installed jauto.exe was not found.' }
          $app = Start-Process $executable.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited -and $app.ExitCode -ne 0) { throw "Installed app exited with $($app.ExitCode)" }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id }
      - name: Verify macOS signature and optional notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle -name '*.app' -type d | head -1)
          dmg=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle -name '*.dmg' -type f | head -1)
          test -n "$app" && test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [[ "$APPLE_SIGNING_MODE" == "developer-id" ]]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$dmg"
          fi
      - name: Smoke-test installed macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle -name '*.dmg' -type f | head -1)
          mount_point="$RUNNER_TEMP/jauto-dmg"
          installed_app="$RUNNER_TEMP/Jauto.app"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse
          cp -R "$mount_point/Jauto.app" "$installed_app"
          hdiutil detach "$mount_point"
          codesign --verify --deep --strict "$installed_app"
          "$installed_app/Contents/MacOS/jauto" & app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
      - uses: actions/upload-artifact@v7
        with:
          name: jauto-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { path: release-assets }
      - name: Create checksums
        run: find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$RELEASE_TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Jauto $RELEASE_TAG" --notes-file .github/release-notes/desktop.md --latest "${prerelease[@]}"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Jauto $RELEASE_TAG" --notes-file .github/release-notes/desktop.md --latest "${prerelease[@]}"
          fi
          mapfile -d '' files < <(find release-assets -type f -print0)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
